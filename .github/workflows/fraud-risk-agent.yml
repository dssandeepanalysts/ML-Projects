name: fraud-risk-agent

on:
  pull_request:
    paths: ["fraud-risk-agent/**", ".github/workflows/fraud-risk-agent.yml"]
  push:
    branches: [main]
    paths: ["fraud-risk-agent/**", ".github/workflows/fraud-risk-agent.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: fraud-risk-agent

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fraud-risk-agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and acceptance tests (no Ollama needed)
        run: python -m pytest -v
      - name: Reproduce all 1,500 synthetic claims and report metrics
        run: python evaluate.py

  # Runs the real local model so the LLM wording path is exercised end to end.
  # Informational: scores and flags are asserted; wording falls back to the template if rejected.
  ollama-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fraud-risk-agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: Install Ollama and pull llama3.2
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for i in $(seq 1 30); do curl -sf http://localhost:11434 >/dev/null && break; sleep 1; done
          curl -sf http://localhost:11434 >/dev/null || (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434 >/dev/null && break; sleep 1; done
          ollama pull llama3.2
      - name: Score flagged claims with the real model
        env:
          FRA_LLM_TIMEOUT: "120"  # measure wording quality here, not runner speed
        run: |
          python - <<'PY'
          import logging, time
          from fra_agent import FraudRiskAgent, build_ollama_llm, read_csv_rows, row_to_request

          logging.basicConfig(level=logging.WARNING, format="%(levelname)s %(message)s")
          llm_agent, template_agent = FraudRiskAgent(llm=build_ollama_llm()), FraudRiskAgent()
          rows = [r for r in read_csv_rows("data/fra_synthetic_claims_1500.csv") if r["risk_flags"] != "[]"][:15]
          accepted = 0
          for row in rows:
              request = row_to_request(row)
              started = time.perf_counter()
              llm, template = llm_agent.assess(request), template_agent.assess(request)
              seconds = time.perf_counter() - started
              assert {k: llm[k] for k in ("status", "risk_score", "confidence", "risk_flags")} == \
                     {k: template[k] for k in ("status", "risk_score", "confidence", "risk_flags")}
              used = llm["reasoning"] != template["reasoning"]
              accepted += used
              print(f"{row['claim_id']} {'LLM     ' if used else 'TEMPLATE'} {seconds:5.1f}s | {llm['reasoning']}")
          print(f"\nLLM wording accepted for {accepted}/{len(rows)} flagged claims")
          PY

  # Builds the real Dockerfile and runs the docker-compose stack the way DEPLOYMENT.md describes.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FRA_API_TOKEN: ci-token
      FRA_LLM_TIMEOUT: "60"  # check the compose wiring here, not CPU speed
    steps:
      - uses: actions/checkout@v4
      - name: Build and start (template only)
        run: docker compose up -d --build --wait
      - name: Smoke test the container
        run: |
          curl -fsS localhost:8000/health
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q fra)")" = healthy
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/assess -d '{}')" = 401
          curl -fsS -X POST localhost:8000/v1/assess -H "Authorization: Bearer $FRA_API_TOKEN" \
               -H "Content-Type: application/json" -d @examples/request_duplicate.json \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print(r); assert (r['status'], r['risk_score']) == ('COMPLETED', 70)"
      - name: Start with the Ollama profile and pull the model
        env:
          FRA_USE_LLM: "1"
        run: |
          docker compose --profile llm up -d --wait fra ollama
          docker compose --profile llm run --rm ollama-pull
          curl -fsS localhost:8000/health | grep -q '"llm_wording":"on"'
          docker compose exec -T ollama ollama run llama3.2 "Say OK." > /dev/null   # load the model once
          curl -fsS -X POST localhost:8000/v1/assess -H "Authorization: Bearer $FRA_API_TOKEN" \
               -H "Content-Type: application/json" -d @examples/request_duplicate.json
          docker compose logs fra | grep "narrative="
          docker compose logs fra | grep -q "narrative=llm"   # the reply was worded by the model
      - name: Container logs
        if: always()
        run: docker compose --profile llm logs --no-color | tail -50
      - name: Clean up
        if: always()
        run: docker compose --profile llm down -v
